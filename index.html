<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資産価値ナビ 関東</title>
<meta name="theme-color" content="#7a3b6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資産価値ナビ">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f7f3f6;--card:#fff;--ink:#2a1f28;--muted:#6b5d68;--line:#e3d9e0;
  --acc:#7a3b6e;--acc-soft:#f3e6f0;--good:#1f7a4d;--good-soft:#e2f3ea;--bad:#c0392b;--bad-soft:#fbe7e3;--warn:#b7791f;--warn-soft:#fdf1dc;
  --gS:#7a3b6e;--gA:#1f7a4d;--gB:#2c6ea0;--gC:#b7791f;--gD:#8a8a8a;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171215;--card:#221a20;--ink:#efe6ec;--muted:#b0a1ac;--line:#3a2e37;--acc:#d79bc8;--acc-soft:#3a2434;
  --good:#6fd3a0;--good-soft:#173326;--bad:#ff8a7a;--bad-soft:#3a1e1a;--warn:#f0c060;--warn-soft:#3a2e14;
  --gS:#d79bc8;--gA:#6fd3a0;--gB:#7fb6e6;--gC:#f0c060;--gD:#a0a0a0;}}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
input,select{max-width:100%;min-width:0}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:1000;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-family:var(--display);font-size:18px;margin:0;flex:1;letter-spacing:.02em}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
main{min-width:0;overflow-x:hidden;max-width:860px;margin:0 auto;padding:12px 16px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-family:var(--display);font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 6px;color:var(--acc)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:700}
input[type=text],input[type=number],input[type=url],select{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:12px 16px;width:100%;font-size:16px;text-decoration:none}
.btn.sub{background:var(--acc-soft);color:var(--acc)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.muni{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 8px;font-size:14px}
.muni label{display:flex;gap:6px;align-items:center}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.bar .n{font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px}
.seg button.on{background:var(--acc);color:#fff}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.grade{flex:0 0 54px;height:54px;border-radius:10px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.grade b{font-size:22px;font-family:var(--display)}.grade small{font-size:11px;opacity:.9}
.gS{background:var(--gS)}.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.item .t{font-weight:700;font-size:15px}
.item .m{font-size:13px;color:var(--muted)}
.price{font-size:17px;font-weight:700;color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--acc-soft);color:var(--acc)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
#map{height:62vh;border-radius:12px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sbar{margin:8px 0}
.sbar .h{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.sbar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.sbar .fill{height:100%;background:var(--acc)}
.sbar ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.big{display:flex;gap:14px;align-items:center}
.big .grade{flex-basis:76px;height:76px}.big .grade b{font-size:32px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.box{background:var(--acc-soft);border-radius:10px;padding:8px 10px}
.box small{display:block;font-size:12px;color:var(--muted)}.box b{font-size:16px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.hidden{display:none!important}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;padding:4px 0;margin-bottom:6px}
.ver{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
svg.chart text{font-size:10px;fill:var(--muted)}
.leaflet-container{font:inherit}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>
<header><h1>資産価値ナビ 関東</h1><button id="favBtnTop" onclick="go('fav')">★ 保存</button></header>
<main id="main"><div class="card">データを読み込んでいます…</div></main>
<nav class="tabs" id="tabs">
  <button data-t="search" class="on" onclick="go('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>さがす</button>
  <button data-t="list" onclick="go('list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>一覧</button>
  <button data-t="map" onclick="go('map')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>地図</button>
  <button data-t="eval" onclick="go('eval')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9H3z"/><path d="m9 15 2 2 4-4"/></svg>物件を評価</button>
  <button data-t="links" onclick="go('links')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>リンク</button>
  <button data-t="info" onclick="go('info')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>情報</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
<script src="tx.js"></script>
<script src="sale.js"></script>
</body>
</html>
